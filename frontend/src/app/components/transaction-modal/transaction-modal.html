<div class="modal-backdrop" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal__header">
      <div>
        <span>Movimentação</span>
        <h2>Nova transação</h2>
      </div>

      <button
        type="button"
        class="modal__close"
        (click)="closeModal()"
      >
        ×
      </button>
    </div>

    <form class="form">
      <div class="form-group">
        <label for="description">
          Descrição
        </label>

        <input
          id="description"
          type="text"
          placeholder="Ex: Supermercado"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="amount">
            Valor
          </label>

          <input
            id="amount"
            type="number"
            placeholder="0,00"
          />
        </div>

        <div class="form-group">
          <label for="date">
            Data
          </label>

          <input
            id="date"
            type="date"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="category">
          Categoria
        </label>

        <select id="category">
          <option value="">
            Selecione uma categoria
          </option>

          <option value="alimentacao">
            Alimentação
          </option>

          <option value="assinaturas">
            Assinaturas
          </option>

          <option value="salario">
            Salário
          </option>

          <option value="freelance">
            Freelance
          </option>
        </select>
      </div>

      <div class="form__actions">
        <button
          type="button"
          class="btn-cancel"
          (click)="closeModal()"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="btn-save"
        >
          Salvar transação
        </button>
      </div>
    </form>
  </div>
</div>
