<div class="modal-backdrop" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal__header">
      <div>
        <span>Movimentação</span>

        <h2>
          {{ transaction ? 'Editar transação' : 'Nova transação' }}
        </h2>
      </div>

      <button
        type="button"
        class="modal__close"
        (click)="closeModal()"
      >
        ×
      </button>
    </div>

    <form class="form">
      <div class="form-group">
        <label for="description">
          Descrição
        </label>

        <input
          id="description"
          type="text"
          [(ngModel)]="description"
          name="description"
          placeholder="Ex: Supermercado"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="amount">
            Valor
          </label>

          <input
            id="amount"
            type="number"
            [(ngModel)]="amount"
            name="amount"
            placeholder="0,00"
            min="0.01"
            step="0.01"
          />
        </div>

        <div class="form-group">
          <label for="dueDate">
            Data de vencimento
          </label>

          <input
            id="dueDate"
            type="date"
            [(ngModel)]="dueDate"
            name="dueDate"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="category">
          Categoria
        </label>

        <select
          id="category"
          [(ngModel)]="categoryId"
          name="categoryId"
        >
          <option value="">
            Selecione uma categoria
          </option>

          @for (category of categories(); track category.id) {
            <option [value]="category.id">
              {{ category.name }}
            </option>
          }
        </select>
      </div>

      <div class="form__actions">
        <button
          type="button"
          class="btn-cancel"
          (click)="closeModal()"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="btn-save"
          (click)="saveTransaction()"
        >
          {{ transaction ? 'Salvar alterações' : 'Salvar transação' }}
        </button>
      </div>
    </form>
  </div>
</div>
