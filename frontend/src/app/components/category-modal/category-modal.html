<div class="modal-backdrop" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal__header">
      <div>
        <span>Categoria</span>
        <h2>Nova categoria</h2>
      </div>

      <button
        type="button"
        class="modal__close"
        (click)="closeModal()"
      >
        ×
      </button>
    </div>

    <form
      class="form"
      (ngSubmit)="saveCategory()"
    >
      <div class="form-group">
        <label for="name">
          Nome
        </label>

        <input
          id="name"
          name="name"
          type="text"
          placeholder="Ex: Alimentação"
          [(ngModel)]="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="type">
          Tipo
        </label>

        <select
          id="type"
          name="type"
          [(ngModel)]="type"
        >
          <option value="Expense">
            Despesa
          </option>

          <option value="Income">
            Receita
          </option>
        </select>
      </div>

      <div class="form__actions">
        <button
          type="button"
          class="btn-cancel"
          (click)="closeModal()"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-save"
        >
          Salvar categoria
        </button>
      </div>
    </form>

  </div>
</div>
